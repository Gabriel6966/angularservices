<h1>Plantilla funciones simple</h1>

<select [(ngModel)]="selectedFuncion">
    <option value="">Selecciona un oficio</option>
    <option *ngFor="let funcion of arrayPlantilla" [value]="funcion">
        {{funcion}}
    </option>
</select>
<button type="button" (click)="getFunciones()" [disabled]="!selectedFuncion">
    Mostrar personas
</button>

<table class="table table-striped">
    <thead>
        <tr>
            <th>ID</th>
            <th>Apellido</th>
            <th>Funcion</th>
            <th>Turno</th>
            <th>Salario</th>
        </tr>
    </thead>
    <tbody>
        @for(person of arrayFunciones; track person.idEmpleado){
        <tr>
            <td>{{person.idEmpleado}}</td>
            <td>{{person.apellido}}</td>
            <td>{{person.funcion}}</td>
            <td>{{person.turno}}</td>
            <td>{{person.salario}}</td>
        </tr>
        }
    </tbody>
</table>
